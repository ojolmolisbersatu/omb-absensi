<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Member</title>
  
  <!-- CSS Utama -->
  <link rel="stylesheet" href="css/style.css">

  <!-- MediaPipe Face Detection & Camera Utils via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container" style="max-width: 480px; margin: 20px auto; padding: 16px;">
    
    <header style="text-align: center; margin-bottom: 24px;">
      <h2>Absensi Presensi Member</h2>
      <p style="color: #666; font-size: 0.9rem;">Silakan pilih event dan lakukan verifikasi wajah</p>
    </header>

    <!-- Form Event -->
    <div class="form-group" style="margin-bottom: 20px;">
      <label for="eventSelect" style="display: block; font-weight: 600; margin-bottom: 8px;">Pilih Event Aktif:</label>
      <select id="eventSelect" class="form-control" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
        <option value="">-- Memuat Event... --</option>
      </select>
    </div>

    <!-- UI Vermuk Kamera Card -->
    <div class="vermuk-card">
      <p class="vermuk-instruction">Pegang HP Anda dengan tegak</p>

      <div class="vermuk-frame-wrapper">
        <div id="vermukFrame" class="vermuk-frame status-red">
          <video id="vermukVideo" autoplay playsinline muted></video>
          <img id="vermukResult" alt="Hasil Foto Absen" style="display: none;" />
        </div>
      </div>

      <div id="vermukFeedback" class="vermuk-feedback status-text-red">
        Mempersiapkan kamera...
      </div>

      <!-- Canvas Tersembunyi -->
      <canvas id="vermukCanvas" style="display: none;"></canvas>

      <div id="vermukActionGroup" class="vermuk-actions" style="display: none;">
        <button type="button" id="btnRetake" class="btn-retake">Foto Ulang</button>
      </div>
    </div>

    <!-- Info Lokasi & Status -->
    <div id="locationStatus" style="margin-top: 16px; font-size: 0.85rem; color: #555; text-align: center;">
      Mengambil koordinat lokasi Anda...
    </div>

    <!-- Tombol Submit Utama -->
    <button id="btnSubmitAbsen" class="btn-primary" style="width: 100%; padding: 12px; margin-top: 16px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer;">
      Kirim Kehadiran
    </button>

  </div>

  <!-- Script Aplikasi -->
  <script src="supabase.js"></script>
  <script src="js/location-picker.js"></script>
  <script src="js/vermuk-camera.js"></script>
  <script src="js/member.js"></script>

</body>
</html>
