<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin | OMB</title><link rel="stylesheet" href="../css/style.css"></head>
<body class="login-page"><main class="login-box"><div class="login-logo"><h1>⚡ OMB</h1><p>OMB ABSENSI V1 — ADMIN</p></div><div id="message" class="notice hidden"></div>
<form id="loginForm" class="form-grid"><div class="field"><label>Email Admin</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button id="loginBtn" type="submit">MASUK ADMIN</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase.js"></script><script src="../js/auth.js"></script>
<script>
(async()=>{const q=new URLSearchParams(location.search);if(q.get('error')==='unauthorized')showMessage(document.getElementById('message'),'Akun ini bukan admin OMB.','error');const {data:{session}}=await supabaseClient.auth.getSession();if(session&&isAdminSession(session))location.replace('index.html');})();
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('message'),btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='MEMPROSES...';try{const {data,error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;if(!isAdminSession(data.session)){await supabaseClient.auth.signOut();throw new Error('Login berhasil, tetapi akun tidak memiliki role admin.');}location.replace('index.html');}catch(err){showMessage(msg,err.message||'Login gagal.','error');btn.disabled=false;btn.textContent='MASUK ADMIN';}});
</script></body></html>
