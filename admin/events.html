<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Manager | OMB</title><link rel="stylesheet" href="../css/style.css"></head><body>
<header class="topbar"><div class="topbar-inner"><div class="brand">⚡ OMB <small>ABSENSI V1 · ADMIN</small></div><nav class="nav"><a href="index.html">Dashboard</a><a href="events.html">Event Manager</a><button onclick="logout()">Logout</button></nav></div></header>
<main class="container"><section class="hero"><h1>Event Manager</h1><p>Buat dan kelola kegiatan OMB.</p></section><div id="message" class="notice hidden"></div>
<div class="card"><div class="row"><h2 id="formTitle">Buat Event</h2><button class="secondary" id="resetBtn">Reset Form</button></div><form id="eventForm" class="form-grid"><input type="hidden" id="eventId"><div class="field"><label>Nama Event *</label><input id="name" required></div><div class="field"><label>Deskripsi</label><textarea id="description"></textarea></div><div class="form-grid two"><div class="field"><label>Tanggal *</label><input id="event_date" type="date" required></div><div class="field"><label>Status *</label><select id="status"><option value="draft">DRAFT</option><option value="active">ACTIVE</option><option value="closed">CLOSED</option><option value="cancelled">CANCELLED</option></select></div><div class="field"><label>Jam Mulai</label><input id="start_time" type="time"></div><div class="field"><label>Jam Selesai</label><input id="end_time" type="time"></div></div><div class="field"><label>Nama Lokasi</label><input id="location_name"></div><div class="form-grid two"><div class="field"><label>Latitude</label><input id="latitude" type="number" step="any"></div><div class="field"><label>Longitude</label><input id="longitude" type="number" step="any"></div><div class="field"><label>Radius Meter</label><input id="radius_meter" type="number" min="0" step="1"></div></div><button id="saveBtn" type="submit">SIMPAN EVENT</button></form></div>
<h2 class="section-title">Daftar Event</h2><div id="eventList" class="loading">Memuat event...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase.js"></script><script src="../js/auth.js"></script><script src="../js/events.js"></script></body></html>
