<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Kelola Event</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-container" style="max-width: 800px; margin: 20px auto; padding: 20px;">
    <h2>Kelola Event & Parameter Absensi</h2>
    
    <!-- Form Tambah Event -->
    <form id="formEvent" style="background: #f9f9f9; padding: 16px; border-radius: 8px; margin-bottom: 24px;">
      <input type="hidden" id="eventId">
      
      <div class="form-group" style="margin-bottom: 12px;">
        <label>Nama Event:</label>
        <input type="text" id="eventTitle" required style="width: 100%; padding: 8px;">
      </div>

      <div style="display: flex; gap: 12px; margin-bottom: 12px;">
        <div style="flex: 1;">
          <label>Waktu Mulai Absen:</label>
          <input type="datetime-local" id="startTime" required style="width: 100%; padding: 8px;">
        </div>
        <div style="flex: 1;">
          <label>Waktu Selesai Absen:</label>
          <input type="datetime-local" id="endTime" required style="width: 100%; padding: 8px;">
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-bottom: 12px;">
        <div style="flex: 1;">
          <label>Latitude:</label>
          <input type="number" step="any" id="latitude" placeholder="-6.200000" style="width: 100%; padding: 8px;">
        </div>
        <div style="flex: 1;">
          <label>Longitude:</label>
          <input type="number" step="any" id="longitude" placeholder="106.816666" style="width: 100%; padding: 8px;">
        </div>
        <div style="flex: 1;">
          <label>Radius (Meter):</label>
          <input type="number" id="radiusMeters" value="100" style="width: 100%; padding: 8px;">
        </div>
      </div>

      <button type="submit" id="btnSaveEvent" class="btn-primary" style="padding: 10px 16px;">Simpan Event</button>
    </form>

    <!-- Tabel Daftar Event -->
    <h3>Daftar Event</h3>
    <table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="background: #eee;">
          <th>Nama Event</th>
          <th>Mulai</th>
          <th>Selesai</th>
          <th>Radius</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="eventTableBody">
        <tr><td colspan="5" style="text-align: center;">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="../supabase.js"></script>
  <script src="../js/events.js"></script>
</body>
</html>
