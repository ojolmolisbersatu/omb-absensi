<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session Manager | OMB</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""></head><body>
<header class="topbar"><div class="topbar-inner">
<div class="brand">⚡ OMB <small>ABSENSI V1 · ADMIN</small></div>
<nav class="nav nav-desktop"><a href="index.html">Dashboard</a><a href="events.html">Event Manager</a><button onclick="logout()">Logout</button></nav>
<button class="nav-logout-mobile" onclick="logout()" aria-label="Logout">⎋</button>
</div></header>

<main class="container">
<section class="hero"><h1>Session Manager</h1><p id="eventInfo">Memuat informasi event...</p></section>
<div id="message" class="notice hidden"></div>

<div class="card">
<div class="row"><h2 id="formTitle">Buat Session</h2><button class="secondary" id="resetBtn" type="button">Reset Form</button></div>
<form id="sessionForm" class="form-grid">
<input type="hidden" id="sessionId">
<div class="field"><label>Nama Session *</label><input id="name" required placeholder="Contoh: Absensi Berangkat"></div>
<div class="field"><label>Deskripsi</label><textarea id="description"></textarea></div>
<div class="form-grid two">
<div class="field"><label>Waktu Mulai *</label><input id="start_at" type="datetime-local" required></div>
<div class="field"><label>Waktu Selesai *</label><input id="end_at" type="datetime-local" required></div>
<div class="field"><label>Status *</label><select id="status"><option value="draft">DRAFT</option><option value="active">ACTIVE</option><option value="closed">CLOSED</option></select></div>
</div>
<div class="field"><label>Lokasi</label><input id="location_name"></div>

<div class="location-picker">
  <button type="button" id="useMyLocationBtn" class="btn secondary full">📍 Gunakan Lokasi Saya</button>
  <div id="locationStatus" class="notice hidden"></div>
  <div id="sessionMap" class="map-box"></div>
  <p class="hint">Tap atau geser marker di peta untuk menyesuaikan titik lokasi.</p>
</div>

<div class="field">
  <label>Radius Absensi</label>
  <div id="radiusPresets" class="chip-group">
    <button type="button" class="chip" data-val="50">50 m</button>
    <button type="button" class="chip" data-val="100">100 m</button>
    <button type="button" class="chip" data-val="200">200 m</button>
    <button type="button" class="chip" data-val="500">500 m</button>
  </div>
  <input id="radius_meter" type="number" min="0" step="1" placeholder="Radius custom (meter)">
</div>

<details class="advanced">
  <summary>Advanced: koordinat manual</summary>
  <div class="form-grid two">
    <div class="field"><label>Latitude</label><input id="latitude" type="number" step="any"></div>
    <div class="field"><label>Longitude</label><input id="longitude" type="number" step="any"></div>
  </div>
</details>

<button id="saveBtn" class="full" type="submit">SIMPAN SESSION</button>
</form>
</div>

<h2 class="section-title">Daftar Session</h2>
<div id="sessionList" class="loading">Memuat session...</div>
</main>

<nav class="bottom-nav">
<a href="index.html"><span class="ic">🏠</span>Dashboard</a>
<a href="events.html"><span class="ic">📅</span>Event</a>
<button onclick="logout()"><span class="ic">⎋</span>Keluar</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase.js"></script><script src="../js/auth.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="../js/location-picker.js"></script>
<script src="../js/sessions.js"></script></body></html>
