<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Absensi Biometrik</title>
  
  <!-- MediaPipe Face Detection CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Video feed */
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror view agar seperti cermin */
    }

    /* Overlay Masking Dark */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      mask-image: radial-gradient(ellipse 130px 180px at center, transparent 99%, black 100%);
      -webkit-mask-image: radial-gradient(ellipse 130px 180px at center, transparent 99%, black 100%);
      z-index: 2;
    }

    /* Bingkai Oval / Face Guide */
    .face-guide {
      position: absolute;
      width: 260px;
      height: 360px;
      border: 4px dashed #ff4757; /* Merah saat belum pas */
      border-radius: 50%;
      z-index: 3;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
    }

    .face-guide.valid {
      border: 4px solid #2ed573; /* Hijau saat pas */
      box-shadow: 0 0 25px rgba(46, 213, 115, 0.8);
    }

    /* Garis Laser Scan Animation */
    .scan-line {
      position: absolute;
      top: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent, #2ed573, transparent);
      box-shadow: 0 0 10px #2ed573;
      animation: scan 2s infinite ease-in-out;
      opacity: 0;
    }

    .face-guide.valid .scan-line {
      opacity: 1;
    }

    @keyframes scan {
      0% { top: 10%; }
      50% { top: 90%; }
      100% { top: 10%; }
    }

    /* Teks Instruksi & Status */
    .status-card {
      position: absolute;
      bottom: 40px;
      z-index: 4;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-text {
      font-size: 15px;
      font-weight: 600;
      color: #ffa502;
    }

    /* Preview Canvas (Sembunyi) */
    canvas#captureCanvas {
      display: none;
    }

    /* Tampilan Hasil Foto setelah dikirim */
    #resultModal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0d1117;
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #resultModal img {
      width: 220px;
      border-radius: 12px;
      border: 3px solid #2ed573;
      margin-bottom: 20px;
    }

    .btn-reset {
      background: #2ed573;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <div class="overlay"></div>
    
    <!-- Bingkai Oval Biometrik -->
    <div class="face-guide" id="faceGuide">
      <div class="scan-line"></div>
    </div>

    <!-- Teks Status -->
    <div class="status-card">
      <div class="status-text" id="statusText">Arahkan wajah ke dalam oval</div>
    </div>

    <!-- Modal Hasil Foto -->
    <div id="resultModal">
      <h2 style="color: #2ed573; margin-bottom: 10px;">Absen Berhasil!</h2>
      <p style="color: #ccc; margin-bottom: 15px; font-size: 14px;">Foto biometrik berhasil ditangkap:</p>
      <img id="capturedImage" src="" alt="Hasil Absen">
      <button class="btn-reset" onclick="resetCapture()">Absen Lagi</button>
    </div>
  </div>

  <canvas id="captureCanvas"></canvas>

  <script>
    const videoElement = document.getElementById('webcam');
    const faceGuide = document.getElementById('faceGuide');
    const statusText = document.getElementById('statusText');
    const captureCanvas = document.getElementById('captureCanvas');
    const resultModal = document.getElementById('resultModal');
    const capturedImage = document.getElementById('capturedImage');

    let isCapturing = false;
    let holdTimer = null;

    // 1. Inisialisasi MediaPipe Face Detection
    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });

    faceDetection.setOptions({
      modelSelection: 0, // 0 = Jarak dekat (selfie/HP)
      minDetectionConfidence: 0.65
    });

    faceDetection.onResults(onResults);

    // 2. Akses Kamera Depan HP (facingMode: "user")
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        if (!isCapturing) {
          await faceDetection.send({ image: videoElement });
        }
      },
      width: 720,
      height: 1280,
      facingMode: "user"
    });

    camera.start();

    // 3. Logika Deteksi & Auto-Capture
    function onResults(results) {
      if (isCapturing) return;

      if (results.detections && results.detections.length > 0) {
        // Wajah Terdeteksi
        faceGuide.classList.add('valid');
        
        if (!holdTimer) {
          statusText.innerText = "Wajah Terdeteksi, Tahan 1 Detik...";
          statusText.style.color = "#2ed573";
          
          // Hitung mundur 1 detik sebelum jepret otomatis
          holdTimer = setTimeout(() => {
            doAutoCapture();
          }, 1000);
        }
      } else {
        // Wajah Tidak Terdeteksi / Hilang
        faceGuide.classList.remove('valid');
        statusText.innerText = "Arahkan wajah ke dalam oval";
        statusText.style.color = "#ffa502";
        
        if (holdTimer) {
          clearTimeout(holdTimer);
          holdTimer = null;
        }
      }
    }

    // 4. Proses Auto Capture (Ambil Frame Kamera)
    function doAutoCapture() {
      isCapturing = true;
      
      // Efek Getar di HP (jika didukung)
      if (navigator.vibrate) {
        navigator.vibrate(100);
      }

      statusText.innerText = "Memproses Absen...";

      // Draw frame dari video ke canvas
      captureCanvas.width = videoElement.videoWidth;
      captureCanvas.height = videoElement.videoHeight;
      const ctx = captureCanvas.getContext('2d');
      
      // Mirror canvas agar hasil foto tidak terbalik
      ctx.translate(captureCanvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(videoElement, 0, 0, captureCanvas.width, captureCanvas.height);

      // Convert ke format Base64 (siap dikirim ke backend / database)
      const imageDataBase64 = captureCanvas.toDataURL('image/jpeg', 0.8);

      // Tampilkan Modal Hasil
      setTimeout(() => {
        capturedImage.src = imageDataBase64;
        resultModal.style.display = 'flex';
      }, 500);
    }

    // Reset untuk tes ulang
    function resetCapture() {
      resultModal.style.display = 'none';
      isCapturing = false;
      holdTimer = null;
      statusText.innerText = "Arahkan wajah ke dalam oval";
      statusText.style.color = "#ffa502";
      faceGuide.classList.remove('valid');
    }
  </script>
</body>
</html>
